[project]
name = "interiores-fictoria-bigdata"
version = "0.1.0"
description = "Pipeline de BI comercial ponta a ponta da Fictoria Casa & Interiores (empresa fictícia, dados sintéticos)"
readme = "README.md"
requires-python = ">=3.12"
license = { file = "LICENSE" }
dependencies = [
    "duckdb>=1.5.5",
    "fsspec>=2026.7.0",
    "matplotlib>=3.11.1",
    "pandas>=3.0.5",
    "pyarrow>=25.0.1",
    "pyodbc>=5.3",
    "python-dotenv>=1.0",
]

[dependency-groups]
dev = [
    "ruff>=0.8",
    "mypy>=1.13",
    "pytest>=8.3",
    "nbclient>=0.11.0",
    "nbformat>=5.11.1",
    "ipykernel>=7.3.0",
]

[project.scripts]
# Cada etapa do pipeline é um comando; os módulos nascem com as etapas (ver README, status).
gerador-origem = "interiores_fictoria.gerador.principal:main"
regua-origem = "interiores_fictoria.validacao.regua:main"
carga-staging = "interiores_fictoria.staging.carga_incremental:main"
bronze-staging = "interiores_fictoria.bronze.extrator:main"
silver-staging = "interiores_fictoria.silver.transformador:main"
gold-staging = "interiores_fictoria.gold.construtor:main"
regua-gold = "interiores_fictoria.validacao.regua_gold:main"
carga-dw = "interiores_fictoria.warehouse.carga:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/interiores_fictoria"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["interiores_fictoria"]
mypy_path = "src"

[[tool.mypy.overrides]]
# bibliotecas sem stubs publicados (py.typed ausente); o resto do projeto segue strict
module = ["fsspec.*", "pyarrow.*", "pyodbc.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
